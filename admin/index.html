<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="robots" content="noindex, nofollow">
<title>明日香村ガイド 管理</title>
<link rel="icon" href="../images/favicon.ico" sizes="any">
<link rel="icon" href="../images/favicon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="../images/apple-touch-icon.png">
<style>
:root{--ink:#1F2A24;--sub:#4A554F;--bg:#F4F6F3;--card:#fff;--line:#D5DBD6;--main:#2F6B4F;--warn:#9A4A12}
body{margin:0;background:var(--bg);color:var(--ink);font:20px/1.6 "Noto Sans JP",sans-serif}
main{max-width:720px;margin:0 auto;padding:20px}
h1{font-size:26px;margin:0 0 4px}
.sum{background:var(--main);color:#fff;border-radius:16px;padding:16px 20px;margin:16px 0;font-size:22px}
.sum b{font-size:48px;display:block;line-height:1.2}
.card{background:var(--card);border:2px solid var(--line);border-radius:14px;padding:16px;margin-bottom:16px}
.card h2{font-size:24px;margin:0 0 4px}
.sub{color:var(--sub);font-size:18px;margin:0 0 8px}
.err{color:var(--warn);font-weight:700}
.d{margin:2px 0;padding:6px 10px;border-radius:8px;word-break:break-all;font-size:18px}
.add{background:#E4F0E8}.del{background:#F6E6DC;text-decoration:line-through}
label{display:block;font-weight:700;margin-top:12px}
input{font:inherit;min-height:52px;width:100%;box-sizing:border-box;margin:6px 0;padding:0 12px;border:2px solid var(--line);border-radius:10px}
button{min-height:52px;padding:0 20px;border:0;border-radius:10px;background:var(--main);color:#fff;font:700 20px inherit;margin:8px 8px 0 0}
button.sec{background:#fff;color:var(--main);border:2px solid var(--main)}
a.btn{display:inline-block;min-height:48px;line-height:48px;padding:0 20px;border:2px solid var(--main);border-radius:10px;color:var(--main);font-weight:700;text-decoration:none;margin-top:8px}
button:focus-visible,a:focus-visible,input:focus-visible{outline:3px solid #1F2A24;outline-offset:2px}
#last{background:#fff;border:2px solid var(--line);border-radius:14px;padding:12px 16px;margin:12px 0}
#last b{display:block;font-size:22px}
#last .kind{display:inline-block;background:#E4F0E8;color:#1F4D38;border-radius:8px;padding:0 10px;font-weight:700}
.e{background:#F6E6DC;border-left:6px solid var(--warn)}
.w{background:#FFF6D6;border-left:6px solid #8A6D00}
.grp{margin:8px 0}.grp summary{font-weight:700}
[hidden]{display:none!important}
</style>
</head>
<body>
<main>
<h1>明日香村ガイド 管理</h1>

<section id="login" class="card" hidden>
<h2>はじめてのログイン</h2>
<p class="sub">この画面の情報は、あなたの鍵(アクセストークン)でだけ読めます。鍵は、この端末の中に、4桁の数字で守って保存されます。</p>
<label for="repo">管理用リポジトリ(例: ユーザー名/asuka-admin)</label>
<input id="repo" autocomplete="off" autocapitalize="off">
<label for="token">鍵(アクセストークン)</label>
<input id="token" type="password" autocomplete="off">
<label for="pin">この端末で使う4桁の数字</label>
<input id="pin" type="password" inputmode="numeric" maxlength="4" autocomplete="off">
<button id="saveBtn">保存して開く</button>
<p id="loginMsg" class="err"></p>
</section>

<section id="unlock" class="card" hidden>
<h2>4桁の数字を入れてください</h2>
<input id="pin2" type="password" inputmode="numeric" maxlength="4" autocomplete="off">
<button id="openBtn">開く</button>
<button id="resetBtn" class="sec">保存した鍵を消す</button>
<p id="unlockMsg" class="err"></p>
</section>

<section id="app" hidden>
<div id="last"></div>
<p class="sub" id="status">読み込み中…</p>
<div class="sum">確認待ち<b id="count">0件</b></div>
<div id="list"></div>
<details class="card" id="audit"><summary>ホームページの点検</summary></details>
<details class="card" id="unlinked"><summary>紐づいていないガイドのページ</summary></details>
<details class="card" id="links"><summary>公式ページとガイドの紐づけ</summary></details>
<details class="card" id="log"><summary>チェックの記録(サイトごと)</summary></details>
<button id="logoutBtn" class="sec">ログアウト(保存した鍵を消す)</button>
</section>
</main>
<script>
const enc = new TextEncoder(), dec = new TextDecoder(), AUTH = "asuka-auth", DONE = "asuka-done";
const b64 = a => btoa(String.fromCharCode(...new Uint8Array(a)));
const unb64 = s => Uint8Array.from(atob(s), c => c.charCodeAt(0));
function mark(n) {  // 変わった文字だけに色をつける(タグの中の文字がはっきりしているときだけ)
  const m = n.match(/^((?:<[^>]+>\s*)*)([^<]+?)((?:\s*<\/[^>]+>)*)$/);
  return m ? m[1] + '<mark style="background:#ffe08a">' + m[2] + "</mark>" + m[3] : n;
}
function plain(h) { return h.replace(/<[^>]*>/g, "").trim(); }
function applyReps(before, reps, hl) {  // 書き換え案を当てはめる。1か所に合わなければ null
  let after = before;
  for (const x of reps) {
    if (before.split(x.old).length !== 2 || after.split(x.old).length !== 2) return null;
    after = after.replace(x.old, () => hl ? mark(x.new) : x.new);
  }
  return after;
}
async function deriveKey(pin, salt) {
  const m = await crypto.subtle.importKey("raw", enc.encode(pin), "PBKDF2", false, ["deriveKey"]);
  return crypto.subtle.deriveKey({name: "PBKDF2", salt, iterations: 200000, hash: "SHA-256"}, m, {name: "AES-GCM", length: 256}, false, ["encrypt", "decrypt"]);
}
async function saveAuth(repo, token, pin) {
  const salt = crypto.getRandomValues(new Uint8Array(16)), iv = crypto.getRandomValues(new Uint8Array(12));
  const ct = await crypto.subtle.encrypt({name: "AES-GCM", iv}, await deriveKey(pin, salt), enc.encode(JSON.stringify({repo, token})));
  localStorage.setItem(AUTH, JSON.stringify({salt: b64(salt), iv: b64(iv), ct: b64(ct), fails: 0}));
}
async function openAuth(pin) {  // 数字が違うと null。5回間違えると、保存した鍵を消す
  const o = JSON.parse(localStorage.getItem(AUTH));
  try {
    const pt = await crypto.subtle.decrypt({name: "AES-GCM", iv: unb64(o.iv)}, await deriveKey(pin, unb64(o.salt)), unb64(o.ct));
    return JSON.parse(dec.decode(pt));
  } catch (e) {
    o.fails = (o.fails || 0) + 1;
    if (o.fails >= 5) localStorage.removeItem(AUTH); else localStorage.setItem(AUTH, JSON.stringify(o));
    return null;
  }
}
const $ = id => document.getElementById(id);
function mk(tag, cls, text) { const e = document.createElement(tag); if (cls) e.className = cls; if (text) e.textContent = text; return e; }
let auth = null, done = [];
try { done = JSON.parse(localStorage.getItem(DONE) || "[]"); } catch (e) {}

async function gh(path) {  // 非公開リポジトリのファイルを、鍵を使って読む
  const r = await fetch("https://api.github.com/repos/" + auth.repo + "/contents/" + path,
    {headers: {Authorization: "Bearer " + auth.token, Accept: "application/vnd.github.raw+json"}, cache: "no-store"});
  if (r.status === 401 || r.status === 403) throw new Error("鍵が使えません。期限切れか、権限が足りない可能性があります。");
  if (r.status === 404) return null;
  if (!r.ok) throw new Error("読み込めませんでした(" + r.status + ")");
  return r.json();
}
const get = name => gh("data/" + name + ".json");
function show(id) { ["login", "unlock", "app"].forEach(x => $(x).hidden = x !== id); }

function renderPending(items) {
  const list = $("list"); list.replaceChildren();
  const todo = items.filter(i => !done.includes(i.id)).reverse();
  $("count").textContent = todo.length + "件";
  $("status").textContent = todo.length ? "公式サイトに変更が見つかりました" : "確認待ちはありません";
  todo.forEach(i => {
    const t = i.target, label = i.kind === "error" ? "読み込みエラー" : t === "NEW" ? "新しい施設の候補" : t === "UNKNOWN" ? "更新するページを判定できませんでした" : t;
    const c = mk("div", "card");
    c.append(mk("h2", "", label), mk("p", "sub", i.date + " / 参照サイト: " + i.url));
    if (i.kind === "change") c.append(mk("p", "sub", "判定の確かさ: " + i.confidence + "(" + (i.reason || "") + ")"));
    (i.changes || []).forEach(x => c.append(mk("div", "d add", x.item + ":" + (x.old || "なし") + " → " + (x.new || ""))));
    const dt = mk("details"); dt.append(mk("summary", "sub", "公式サイトの変更を見る"));
    i.diff.forEach(l => dt.append(mk("div", "d " + (l[0] === "+" ? "add" : "del"), l.slice(1))));
    c.append(dt);
    const a = mk("a", "btn", "公式サイトを開く"); a.href = i.url; a.target = "_blank"; a.rel = "noopener";
    const b = mk("button", "", "確認した");
    b.onclick = () => { done.push(i.id); try { localStorage.setItem(DONE, JSON.stringify(done)); } catch (e) {} renderPending(items); };
    if (i.proposal) { const pb = mk("button", "", "書き換え案とプレビューを見る"); pb.onclick = () => openPreview(i, c); c.append(pb); }
    c.append(b, a); list.append(c);
  });
}
async function openPreview(i, card) {  // 書き換え案を、変更前・変更後の見た目で確認する
  let box = card.querySelector(".pv");
  if (box) { box.hidden = !box.hidden; return; }
  box = mk("div", "pv"); card.append(box); box.append(mk("p", "sub", "読み込み中…"));
  try {
    const p = await gh("data/proposals/" + i.id + ".json");
    if (!p) throw new Error("書き換え案が見つかりません。");
    const file = p.target.split("#")[0], url = new URL("../" + file, location.href).href;
    const r = await fetch(url, {cache: "no-store"});
    if (!r.ok) throw new Error("ガイドのページを読めませんでした(" + file + ")");
    const before = await r.text(), after = applyReps(before, p.replacements, false), shown = applyReps(before, p.replacements, true);
    box.replaceChildren();
    if (!after) { box.append(mk("p", "err", "ガイドのページが、書き換え案を作ったときから変わっています。次の実行で、作り直されます。")); return; }
    box.append(mk("h3", "", "書き換え案(" + file + ")"));
    p.replacements.forEach(x => box.append(mk("div", "d del", "変更前:" + plain(x.old)), mk("div", "d add", "変更後:" + plain(x.new))));
    const wrap = mk("div"), view = {side: "after", w: 390};
    wrap.style.cssText = "overflow-x:auto;margin-top:8px";
    const draw = () => {
      const f = document.createElement("iframe"), src = view.side === "after" ? shown : before, base = '<base href="' + url + '">';
      f.setAttribute("sandbox", "");  // 中のプログラムは動かさない
      f.srcdoc = /<head[^>]*>/i.test(src) ? src.replace(/<head[^>]*>/i, m => m + base) : base + src;
      f.style.cssText = "width:" + view.w + "px;height:480px;border:2px solid var(--line);border-radius:10px;background:#fff";
      wrap.replaceChildren(f);
    };
    const btn = (t, fn) => { const b = mk("button", "sec", t); b.onclick = () => { fn(); draw(); }; return b; };
    box.append(btn("変更前を見る", () => view.side = "before"), btn("変更後を見る", () => view.side = "after"),
               btn("スマホ表示", () => view.w = 390), btn("パソコン表示", () => view.w = 980), wrap);
    draw();
    const ap = mk("button", "", "承認して公開する(次の段階で使えます)"); ap.disabled = true; ap.style.opacity = ".5"; box.append(mk("div"), ap);
  } catch (e) { box.replaceChildren(mk("p", "err", e.message)); }
}
function fmtWhen(iso) {  // 日本時間で「2026/10/22 05:12」の形にする
  return new Date(iso).toLocaleString("ja-JP", {timeZone: "Asia/Tokyo", year: "numeric", month: "numeric", day: "numeric", hour: "2-digit", minute: "2-digit", hour12: false});
}
function renderLast(runs) {  // 最後のチェックの日時と種類
  const el = $("last"), r = runs && runs[runs.length - 1]; el.replaceChildren();
  if (!r) { el.append(mk("b", "", "チェックの記録は、まだありません")); return; }
  el.append(mk("b", "", "最終チェック:" + (r.finished_at ? fmtWhen(r.finished_at) : r.date)));
  el.append(mk("span", "kind", r.mode === "weekly" ? "週1の全体チェック" : "毎日チェック"));
  if (!r.finished_at) el.append(mk("div", "sub", "時刻は、次の実行から表示されます。"));
  else if (Date.now() - new Date(r.finished_at).getTime() > 36 * 3600 * 1000)
    el.append(mk("div", "err", "最後のチェックから36時間以上たっています。自動実行が止まっていないか、Actionsを確認してください。"));
}
const GUIDE_REPO = "asuka-travel-guide/asuka-travel-guide";
function renderAudit(a) {  // ガイドのホームページの点検結果(リンク切れ・コード不備)
  const box = $("audit");
  if (!a) { box.firstChild.textContent = "ホームページの点検(まだ実行されていません)"; return; }
  const ext = a.external_issues || [], all = (a.issues || []).concat(ext);
  const err = all.filter(i => i.severity === "error").length, warn = all.length - err;
  const head = all.length ? "エラー " + err + "件・注意 " + warn + "件" : "問題は見つかりませんでした";
  box.firstChild.textContent = "ホームページの点検:" + head;
  $("last").append(mk("div", err ? "err" : "sub", "ホームページの点検:" + head + "(" + fmtWhen(a.checked_at) + "、" + a.pages + "ページ)"));
  box.append(mk("p", "sub", "内部の点検:" + fmtWhen(a.checked_at) + " / 外部リンクの点検:" + (a.external_checked_at ? fmtWhen(a.external_checked_at) + "(週1回)" : "まだ実行されていません")));
  const by = {}, cnt = (l, s) => l.filter(i => i.severity === s).length;
  (a.issues || []).forEach(i => (by[i.page] = by[i.page] || []).push(i));
  Object.keys(by).sort((x, y) => cnt(by[y], "error") - cnt(by[x], "error") || x.localeCompare(y)).forEach(pg => {
    const list = by[pg].sort((p, q) => (q.severity === "error") - (p.severity === "error") || (p.line || 0) - (q.line || 0)), dt = mk("details", "grp");  // エラーを先に
    dt.append(mk("summary", "", pg + "(エラー " + cnt(list, "error") + "・注意 " + cnt(list, "warn") + ")"));
    list.forEach(i => dt.append(mk("div", "d " + (i.severity === "error" ? "e" : "w"), (i.severity === "error" ? "エラー:" : "注意:") + i.message + (i.line ? "(" + i.line + "行目)" : ""))));
    const l = mk("a", "btn", "GitHubで開く"); l.href = "https://github.com/" + GUIDE_REPO + "/blob/main/" + pg; l.target = "_blank"; l.rel = "noopener";
    dt.append(l); box.append(dt);
  });
  if (ext.length) {
    const dt = mk("details", "grp"); dt.append(mk("summary", "", "外部サイトへのリンク(" + ext.length + "件)"));
    ext.forEach(i => dt.append(mk("div", "d " + (i.severity === "error" ? "e" : "w"), (i.severity === "error" ? "エラー:" : "注意:") + i.message + " " + i.url + "(使っているページ:" + i.pages.join("、") + ")")));
    box.append(dt);
  }
  if (a.external_skipped) box.append(mk("p", "sub", "外部リンクが多いため、" + a.external_skipped + "件は、今回は確認していません。"));
}
function renderLog(runs) {
  const r = runs && runs[runs.length - 1]; if (!r) return;
  const box = $("log");
  box.append(mk("p", "sub", r.date + (r.mode === "weekly" ? "(週1の全体チェック)" : "(毎日チェック)") + " / AI判定 " + (r.ai_calls || 0) + "回"));
  r.sites.forEach(s => box.append(mk("div", "d", s.error ? s.url + ":読み込みエラー" :
    s.url + " ― " + s.pages + "ページ(上限" + s.max_pages + ")、最も深い階層 " + s.depth_reached + "、変更 " + s.changes + "件" +
    (s.filtered ? "(共通・頻繁に変わる部分として除外 " + s.filtered + "件)" : "") + (s.mass_guard ? " ★一斉変更" : "") + "、" + s.seconds + "秒" + (s.hit_page_limit ? " ★上限に達しました" : ""))));
}
function renderLinks(m) {
  if (!m) return; const box = $("links"), g = {};
  Object.keys(m).forEach(u => (g[m[u].target] = g[m[u].target] || []).push(u));
  box.append(mk("p", "sub", "ガイドのページ " + Object.keys(g).length + "件に紐づけ(手動は tools/links-manual.csv、外すときは tools/links-ignore.txt)"));
  Object.keys(g).sort().forEach(t => {
    box.append(mk("div", "d add", t + "(公式ページ " + g[t].length + "件)"));
    g[t].forEach(u => box.append(mk("div", "d", (m[u].manual ? "[手動] " : "[自動] ") + (m[u].title || "") + " " + u)));
  });
}
function renderUnlinked(un, off) {
  if (!un) return; off = off || {}; const box = $("unlinked");
  box.firstChild.textContent = "紐づいていないガイドのページ(" + un.length + "件)";
  un.forEach(e => {
    const row = mk("div", "d"), out = mk("div"), b = mk("button", "", "公式ページの候補を探す");
    row.append(mk("div", "", e.name + "  " + e.path));
    b.onclick = () => {
      out.replaceChildren();
      const toks = e.name.split(/[\s・（）()｜]+/).filter(t => t.length >= 3), ks = toks.length ? toks : [e.name];
      const hits = Object.keys(off).filter(u => ks.some(t => off[u].includes(t))).slice(0, 8);
      if (!hits.length) out.append(mk("div", "sub", "候補が見つかりませんでした"));
      hits.forEach(u => {
        const line = e.path + "," + u + "," + e.name, d = mk("div", "d add", off[u] + "  " + u), c = mk("button", "", "CSVの1行をコピー");
        c.onclick = () => navigator.clipboard.writeText(line).then(() => { c.textContent = "コピーしました"; }); d.append(c); out.append(d);
      });
    };
    row.append(b, out); box.append(row);
  });
}
async function start() {
  show("app");
  try {
    const [pend, log, links, unl, off, aud] = await Promise.all(["pending", "crawl-log", "links", "unlinked", "official-pages", "audit"].map(get));
    renderLast(log); renderAudit(aud);
    if (pend === null) { $("status").textContent = "データが見つかりません。リポジトリ名と、最初の実行が済んでいるかを確認してください。"; return; }
    renderPending(pend); renderLog(log); renderLinks(links); renderUnlinked(unl, off);
  } catch (e) { $("status").textContent = e.message; $("status").className = "err"; }
}
$("saveBtn").onclick = async () => {
  const repo = $("repo").value.trim(), token = $("token").value.trim(), pin = $("pin").value;
  if (!/^[\w.-]+\/[\w.-]+$/.test(repo)) { $("loginMsg").textContent = "リポジトリは「ユーザー名/名前」の形で入れてください。"; return; }
  if (!token) { $("loginMsg").textContent = "鍵(アクセストークン)を入れてください。"; return; }
  if (!/^\d{4}$/.test(pin)) { $("loginMsg").textContent = "4桁の数字を入れてください。"; return; }
  await saveAuth(repo, token, pin); auth = {repo, token}; $("token").value = ""; start();
};
$("openBtn").onclick = async () => {
  const a = await openAuth($("pin2").value);
  if (a) { auth = a; $("pin2").value = ""; start(); return; }
  if (localStorage.getItem(AUTH)) $("unlockMsg").textContent = "数字が違います(5回間違えると、保存した鍵が消えます)。";
  else { $("unlockMsg").textContent = ""; show("login"); $("loginMsg").textContent = "5回間違えたので、保存した鍵を消しました。もう一度入れてください。"; }
};
function wipe() { localStorage.removeItem(AUTH); auth = null; show("login"); }
$("resetBtn").onclick = wipe; $("logoutBtn").onclick = wipe;
show(localStorage.getItem(AUTH) ? "unlock" : "login");
</script>
</body>
</html>
