name: 公式サイトの毎日チェック
on:
  schedule:
    - cron: "0 20 * * *"   # 日本時間の毎朝5時
  workflow_dispatch:        # 手動でも実行できる
permissions:
  contents: write
jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 300
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python tools/check_sites.py
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
      - name: 変更があれば保存
        run: |
          git config user.name "asuka-checker"
          git config user.email "actions@users.noreply.github.com"
          git add data
          git diff --cached --quiet || (git commit -m "公式サイトの変更を記録" && git push)
