<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="100%" height="100%">
  <!-- 背景（深緑の円） -->
  <circle cx="32" cy="32" r="30" fill="#2d5a27" />

  <!-- 切り絵風の太い輪郭線（黒） -->
  <g stroke="#111111" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
    
    <!-- 地面・土台ライン（少し下げる＆外側へ拡張） -->
    <path d="M 5 56 C 20 54, 44 54, 59 56" />

    <!-- 中央の空洞（切り絵の黒い隙間） -->
    <path d="M 20 44 L 43 44 L 41 50 L 22 50 Z" fill="#111111" />

    <!-- 1. 下部の組石群（灰色） -->
    <!-- 左下の石 -->
    <path d="M 9 55 L 18 43 L 25 45 L 21 55 Z" fill="#888888" />
    <!-- 中央左の石 -->
    <path d="M 21 55 L 25 45 L 35 47 L 33 55 Z" fill="#9e9e9e" />
    <!-- 中央右の斜めの石 -->
    <path d="M 33 55 L 35 47 L 50 41 L 47 55 Z" fill="#8e8e8e" />
    <!-- 右下の石 -->
    <path d="M 47 55 L 50 41 L 56 45 L 55 55 Z" fill="#7d7d7d" />

    <!-- 2. 上部の巨石（天井石） -->
    <!-- 左の天井石：頂点をより「左寄り（x=19付近）」に設定 -->
    <path d="M 16 42 
             C 13 35, 15 22, 19 18 
             C 24 15, 27 19, 32 30 
             C 34 36, 33 40, 32 42 
             Z" 
          fill="#adadad" />

    <!-- 右の天井石：平らで右に迫り出した形状 -->
    <path d="M 32 42 
             C 32 33, 34 28, 45 27 
             C 53 27, 56 29, 56 35 
             C 56 41, 51 42, 44 42 
             Z" 
          fill="#999999" />

    <!-- 二つの天井石の境界線（縦の切り込み影） -->
    <path d="M 32 30 L 32 42" fill="none" stroke="#111111" stroke-width="2.5" />

  </g>
</svg>
