<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" viewBox="0 0 1200 630" width="1200" height="630">
  <defs>
    <!-- 深緑グラデーション背景 -->
    <linearGradient id="grad_bg" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#3d7735;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#21441e;stop-opacity:1" />
    </linearGradient>
    
    <!-- 影効果 -->
    <filter id="dropShadow" x="-5%" y="-5%" width="110%" height="110%">
      <feDropShadow dx="4" dy="6" stdDeviation="5" flood-color="#000" flood-opacity="0.3"/>
    </filter>
  </defs>

  <!-- 背景 -->
  <rect width="1200" height="630" fill="url(#grad_bg)" />

  <!-- 和風の霧模様 -->
  <path d="M 0,150 Q 300,50 600,150 T 1200,150 V 630 H 0 Z" fill="#ffffff" fill-opacity="0.05" />
  <path d="M 0,250 Q 300,150 600,250 T 1200,250 V 630 H 0 Z" fill="#ffffff" fill-opacity="0.03" />

  <!-- MAIN ILLUSTRATION: 石舞台 -->
  <g transform="translate(70, 40) scale(8.5)" filter="url(#dropShadow)">
    <circle cx="32" cy="32" r="30" fill="#ffffff" fill-opacity="0.1" />
    <g stroke="#111111" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
      <path d="M 5 56 C 20 54, 44 54, 59 56" />
      <path d="M 20 44 L 43 44 L 41 50 L 22 50 Z" fill="#111111" />
      <path d="M 9 55 L 18 43 L 25 45 L 21 55 Z" fill="#888888" />
      <path d="M 21 55 L 25 45 L 35 47 L 33 55 Z" fill="#9e9e9e" />
      <path d="M 33 55 L 35 47 L 50 41 L 47 55 Z" fill="#8e8e8e" />
      <path d="M 47 55 L 50 41 L 56 45 L 55 55 Z" fill="#7d7d7d" />
      <path d="M 16 42 C 13 35, 15 22, 19 18 C 24 15, 27 19, 32 30 C 34 36, 33 40, 32 42 Z" fill="#adadad" />
      <path d="M 32 42 C 32 33, 34 28, 45 27 C 53 27, 56 29, 56 35 C 56 41, 51 42, 44 42 Z" fill="#999999" />
      <path d="M 32 30 L 32 42" fill="none" stroke="#111111" stroke-width="2.5" />
    </g>
  </g>

  <!-- TEXT AREA -->
  <text x="630" y="375" font-family="'Hiragino Sans', 'メイリオ', sans-serif" font-size="76" font-weight="bold" fill="#ffffff">
    明日香村
  </text>
  <text x="630" y="465" font-family="'Hiragino Sans', 'メイリオ', sans-serif" font-size="76" font-weight="bold" fill="#ffffff">
    観光ガイド
  </text>
  
  <text x="630" y="545" font-family="'Hiragino Mincho ProN', 'Yu Mincho', serif" font-size="32" font-weight="normal" fill="#e0e0e0" letter-spacing="1">
    〜日本のはじまりをあるく。〜
  </text>

  <!-- 最下部の帯（砂色 #d4c59a に変更） -->
  <rect x="0" y="612" width="1200" height="18" fill="#d4c59a" />
</svg>
