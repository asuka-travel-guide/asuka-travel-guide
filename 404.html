<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ページが見つかりません｜明日香村観光ガイド</title>
  <meta name="robots" content="noindex">
  <!-- 404ページはどの階層からでも表示されるため、パスはすべて絶対パスで書いています -->
  <link rel="icon" href="/asuka-travel-guide/images/favicon.ico" sizes="any">
  <link rel="icon" href="/asuka-travel-guide/images/favicon.svg" type="image/svg+xml">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+JP:wght@400;500;700&display=swap" rel="stylesheet">
  <style>
    :root { --primary: #20593c; --primary-hover: #2d8a55; --bg: #ffffff; --text: #444444; --sub: #666666; --border: #dddddd; --soft: #d3f7e0; }
    @media (prefers-color-scheme: dark) { :root { --bg: #1b1f1d; --text: #e6e6e6; --sub: #b5b5b5; --border: #3a403d; --soft: #20593c; --primary: #7fd1a0; --primary-hover: #a6e3bf; } }
    * { box-sizing: border-box; }
    body { margin: 0; font-family: "Noto Sans JP", sans-serif; color: var(--text); background: var(--bg); line-height: 1.8; }
    header { border-bottom: 1px solid var(--border); padding: 16px 20px; }
    header a { color: var(--primary); font-weight: 700; font-size: 1.1rem; text-decoration: none; }
    main { max-width: 640px; margin: 0 auto; padding: 56px 20px 72px; text-align: center; }
    .code { font-size: 4rem; font-weight: 700; color: var(--primary); line-height: 1; margin: 0 0 8px; }
    h1 { font-size: 1.4rem; margin: 0 0 16px; }
    p { margin: 0 0 28px; color: var(--sub); }
    ul { list-style: none; padding: 0; margin: 0; display: flex; flex-wrap: wrap; gap: 12px; justify-content: center; }
    li a { display: inline-block; padding: 10px 20px; border: 1px solid var(--primary); border-radius: 999px; color: var(--primary); text-decoration: none; }
    li a:hover, li a:focus-visible { background: var(--soft); border-color: var(--primary-hover); }
    li.main a { background: var(--primary); color: #fff; }
    li.main a:hover, li.main a:focus-visible { background: var(--primary-hover); }
    footer { text-align: center; font-size: .8rem; color: var(--sub); padding: 0 20px 32px; }
  </style>
</head>
<body>
  <header><a href="/asuka-travel-guide/">明日香村観光ガイド</a></header>
  <main>
    <p class="code">404</p>
    <h1>お探しのページが見つかりませんでした</h1>
    <p>ページが移動または削除されたか、URLが間違っている可能性があります。<br>下のリンクから目的のページをお探しください。</p>
    <ul>
      <li class="main"><a href="/asuka-travel-guide/">トップページ</a></li>
      <li><a href="/asuka-travel-guide/spots/index.html">観光する</a></li>
      <li><a href="/asuka-travel-guide/gourmet/index.html">食べる</a></li>
      <li><a href="/asuka-travel-guide/stay/index.html">泊まる</a></li>
      <li><a href="/asuka-travel-guide/spots/parking.html">駐車場</a></li>
    </ul>
  </main>
  <footer>&copy; 2026 Asuka Travel Guide. All Rights Reserved.</footer>
</body>
</html>
